<!--
  The app mark, by hand, matching scripts/generate-icons.mjs.
  Keep the two in step if the artwork changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Expiry Reminders">
  <rect width="64" height="64" rx="14" fill="#3b2ed4"/>

  <!-- Calendar: two binding rings, a solid header band, and an outlined page
       whose interior shows the field through, marked with date dashes. -->
  <g fill="#fff">
    <rect x="18.6" y="12.9" width="3.6" height="9.4" rx="1.8"/>
    <rect x="41.8" y="12.9" width="3.6" height="9.4" rx="1.8"/>
  </g>
  <path
    d="M13.6 24.5a4.5 4.5 0 0 1 4.5-4.5h27.8a4.5 4.5 0 0 1 4.5 4.5v25.6a4.5 4.5 0 0 1-4.5 4.5H18.1a4.5 4.5 0 0 1-4.5-4.5Zm4.8 8.6v16.4a1.3 1.3 0 0 0 1.3 1.3h24.6a1.3 1.3 0 0 0 1.3-1.3V33.1Z"
    fill="#fff" fill-rule="evenodd"/>
  <g fill="#fff">
    <rect x="21.6" y="37.4" width="5.6" height="2.6" rx="1.3"/>
    <rect x="29.2" y="37.4" width="5.6" height="2.6" rx="1.3"/>
    <rect x="36.8" y="37.4" width="5.6" height="2.6" rx="1.3"/>
    <rect x="21.6" y="43.8" width="5.6" height="2.6" rx="1.3"/>
    <rect x="29.2" y="43.8" width="5.6" height="2.6" rx="1.3"/>
    <rect x="36.8" y="43.8" width="5.6" height="2.6" rx="1.3"/>
  </g>

  <!-- Green check badge, ringed so it reads clearly against the field. -->
  <circle cx="52.2" cy="11.8" r="8.4" fill="#22c55e" stroke="#fff" stroke-width="2.4"/>
  <path d="m48.9 12 2.4 2.4 4.5-5" fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
