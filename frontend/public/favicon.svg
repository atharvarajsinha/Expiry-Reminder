<!--
  The app mark, by hand, matching scripts/generate-icons.mjs.
  Keep the two in step if the artwork changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Remind Vahan">
  <rect width="64" height="64" rx="14" fill="#3b2ed4"/>

  <!-- Car: body bar, roof outline, and two wheels with the field showing through. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.9 34.9 26.2 26.8h11.6l6.3 8.1" stroke-width="4.5"/>
    <circle cx="22.2" cy="44.4" r="3.3" stroke-width="2.5"/>
    <circle cx="41.2" cy="44.4" r="3.3" stroke-width="2.5"/>
  </g>
  <rect x="13.9" y="34.3" width="36" height="7.5" rx="2.9" fill="#fff"/>

  <!-- Green check badge, ringed so it reads clearly against the field. -->
  <circle cx="52.2" cy="11.8" r="8.4" fill="#22c55e" stroke="#fff" stroke-width="2.4"/>
  <path d="m48.9 12 2.4 2.4 4.5-5" fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
