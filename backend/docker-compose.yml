# Local development stack: MongoDB + the web service. That is the whole app --
# there is no broker, no worker and no scheduler to run alongside it.
#
# For production use MongoDB Atlas instead of the container below (drop the
# service and point MONGODB_URI at the managed URL).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  mongo_data:
