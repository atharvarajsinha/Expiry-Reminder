# Render blueprint: one web service, and one optional cron job.
#
# There is no Redis, no worker and no Celery Beat. The web service runs the
# daily reminder sweep on the first request of each day; the cron job below is
# what makes reminders arrive on days nobody opens the app. Drop it if you are
# happy for email to depend on the app being visited.
#
# MongoDB comes from MongoDB Atlas (set MONGODB_URI).
services:
  - type: web
    name: expiry-reminder-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: ./entrypoint.sh web
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # The shared secret the cron job below presents as X-Cron-Token.
      - key: CRON_TOKEN
        generateValue: true
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: expiry_reminder
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: REMINDER_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: AUTH_COOKIE_SAMESITE
        value: None

  # 09:00 Asia/Kolkata == 03:30 UTC. Render cron schedules are UTC.
  - type: cron
    name: expiry-reminder-sweep
    runtime: docker
    plan: starter
    schedule: "30 3 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      sh -c "curl -fsS -X POST -H \"X-Cron-Token: $CRON_TOKEN\" $API_URL/api/reminders/run/"
    envVars:
      # Copy the generated value from the web service, and set API_URL to its
      # public URL (https://expiry-reminder-api.onrender.com).
      - key: CRON_TOKEN
        sync: false
      - key: API_URL
        sync: false
