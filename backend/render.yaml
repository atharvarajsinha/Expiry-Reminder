# Render blueprint: one web service. That is the whole backend.
#
# There is no Redis, no worker, no Celery Beat and no Render Cron Job. Nothing
# in this image runs on a timer.
#
# Reminder email is sent when something outside calls
# GET /api/reminders/run/?token=<CRON_TOKEN>. Point a free uptime monitor
# (UptimeRobot, Better Stack, Cron-Job.org) at that URL and leave it on its
# default interval: the endpoint itself enforces "once a day, not before
# REMINDER_HOUR", so being pinged every five minutes is harmless.
#
# See script.txt for the monitor setup. MongoDB comes from Atlas.
services:
  - type: web
    name: expiry-reminder-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: ./entrypoint.sh web
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # The secret the uptime monitor presents. Copy the generated value into
      # the monitor's URL after the first deploy.
      - key: CRON_TOKEN
        generateValue: true
      # Local hour at or after which the daily check may run.
      - key: REMINDER_HOUR
        value: "9"
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: expiry_reminder
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: REMINDER_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Decides which calendar day "7 days before" lands on.
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: AUTH_COOKIE_SAMESITE
        value: None
